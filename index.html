<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Music Receiver — Studio HQ</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-grid"></div>
    <div class="bg-glow bg-glow-a"></div>
    <div class="bg-glow bg-glow-b"></div>

    <main class="app-shell">
      <header class="hero glass floating">
        <h1>Live Music Receiver <span>Studio HQ</span></h1>
        <p>Upload songs or MP4 videos and play them slowed, reverbed, wider, and richer with retro-future style.</p>
      </header>

      <section class="panel glass controls floating">
        <div class="top-row">
          <label class="upload" for="mediaInput">
            <input id="mediaInput" type="file" accept="audio/*,video/mp4" />
            <span>Upload Song or MP4</span>
          </label>
          <div class="badge" id="mediaBadge">Waiting for media…</div>
        </div>

        <div class="preset-group">
          <h2>5 Studio Presets</h2>
          <div class="preset-list" id="presetList"></div>
        </div>

        <div class="sliders">
          <label>Slow Amount<input id="speed" type="range" min="0.55" max="1" step="0.01" value="0.82" /><output id="speedOut">0.82x</output></label>
          <label>Reverb Mix<input id="wet" type="range" min="0" max="1" step="0.01" value="0.42" /><output id="wetOut">42%</output></label>
          <label>Warmth<input id="warmth" type="range" min="-12" max="12" step="1" value="4" /><output id="warmthOut">+4 dB</output></label>
          <label>Presence<input id="presence" type="range" min="-12" max="12" step="1" value="3" /><output id="presenceOut">+3 dB</output></label>
          <label>Stereo Width<input id="width" type="range" min="0" max="1" step="0.01" value="0.25" /><output id="widthOut">25%</output></label>
          <label>Saturation<input id="drive" type="range" min="0" max="1" step="0.01" value="0.18" /><output id="driveOut">18%</output></label>
        </div>
      </section>

      <section class="panel glass playback floating">
        <div class="media-wrap">
          <audio id="audio" controls></audio>
          <video id="video" controls playsinline hidden></video>
          <p id="emptyState">No media loaded yet.</p>
        </div>
        <canvas id="viz" width="960" height="170" aria-label="audio visualizer"></canvas>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
